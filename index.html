<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="weather-icon.webp" type="image/x-icon">

      
      </head>
<body class=" flex items-center justify-center h-screen bg-gradient-to-r from-yellow-400 via-purple-500 to-yellow-600">
    <div class=" h-96 bg-purple-400 p-8 rounded-lg shadow-2xl text-center animate-fade-in">
        <h2 class="text-2xl font-bold text-clifford">Weather App</h2>
        <input  type="text" id="city" placeholder="Enter a city name"
        class="w-full p-4 mt-4 rounded-md border border-gray-300 focus:outline-none focus:ring-blue-500 focus:ring-2">

        <button onclick="getWeather()" 
        class="mt-4 py-2 bg-blue-500 rounded-md w-full text-white transition-transform transform hover:scale-105 " >Get Weather</button>
        <div id="weather-info" class="mt-5 opacity-0 transition-opacity duration-500"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
